[project]
name = "pos-grading"
version = "0.1.0"
description = "Преподавательская оценка студентов — ДЗ №2 по КПО"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["punq>=0.9.0,<1"]

[project.scripts]
pos = "pos.main:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pos"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "mypy>=2.4,<3"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "punq"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
